<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Voice Line — Test Client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --bg: #17130f;
    --surface: #211a14;
    --surface-raised: #2a221a;
    --border: #3d3327;
    --accent: #e3a94a;
    --accent-dim: #8a6a34;
    --live: #c1553b;
    --text: #f2e9dd;
    --text-muted: #a79a86;
    --text-faint: #6f6252;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(227,169,74,0.08), transparent);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .khachkar-rule {
    height: 6px;
    background-image: repeating-linear-gradient(
      -45deg,
      var(--accent) 0, var(--accent) 2px,
      transparent 2px, transparent 10px
    );
    opacity: 0.55;
  }

  .card-inner { padding: 36px 32px 28px; }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 27px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    color: var(--text);
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0 0 32px;
    max-width: 34ch;
  }

  .subtitle b { color: var(--text); font-weight: 500; }

  /* --- Hero: the connect button --- */

  .dial {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 30px;
  }

  .dial-btn {
    position: relative;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .dial-btn:hover { transform: scale(1.03); }
  .dial-btn:active { transform: scale(0.98); }

  .dial-btn svg { width: 34px; height: 34px; }
  .dial-btn.connected { background: var(--live); }

  .dial-btn .ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    opacity: 0;
  }
  .dial-btn.listening .ring {
    animation: pulse-ring 1.8s ease-out infinite;
  }
  @keyframes pulse-ring {
    0%   { transform: scale(0.92); opacity: 0.65; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  .status-line {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-faint);
  }
  .status-dot.live { background: var(--live); }
  .status-dot.ready { background: var(--accent); }

  /* --- Connection settings (secondary, collapsed) --- */

  details.settings {
    border-top: 1px solid var(--border);
    margin: 0 -32px;
    padding: 18px 32px 0;
  }
  details.settings summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  details.settings summary::before {
    content: '';
    width: 0; height: 0;
    border-left: 4px solid var(--text-faint);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform 0.15s ease;
  }
  details.settings[open] summary::before { transform: rotate(90deg); }
  details.settings summary::-webkit-details-marker { display: none; }

  .field { margin-top: 14px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 9px 10px;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  .settings-body { padding-bottom: 20px; }

  /* --- Log / transcript panel --- */

  .log-panel {
    border-top: 1px solid var(--border);
    background: #120e0a;
    margin: 0 -32px -28px;
    padding: 14px 32px 20px;
    max-height: 160px;
    overflow-y: auto;
  }
  .log-panel .log-label {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: none;
    margin-bottom: 8px;
  }
  .log-line {
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text-muted);
    white-space: pre-wrap;
  }
  .log-line .t { color: var(--text-faint); }

  audio { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .dial-btn.listening .ring { animation: none; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="khachkar-rule"></div>
    <div class="card-inner">

      <h1>Bank Voice Line</h1>
      <p class="subtitle">
        Ask about <b>loans</b>, <b>deposits</b>, or <b>branch locations</b>
        out loud.
      </p>

      <div class="dial">
        <button id="dialBtn" class="dial-btn" aria-label="Connect and enable microphone" disabled>
          <span class="ring"></span>
          <svg id="dialIcon" viewBox="0 0 24 24" fill="none" stroke="#17130f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
            <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="8" y1="22" x2="16" y2="22"/>
          </svg>
        </button>
        <div class="status-line">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Fetching access token…</span>
        </div>
      </div>

      <details class="settings">
        <summary>Connection details</summary>
        <div class="settings-body">
          <div class="field">
            <label for="url">LiveKit URL</label>
            <input id="url" readonly>
          </div>
          <div class="field">
            <label for="token">Access token (auto-issued, expires with the session)</label>
            <input id="token" readonly>
          </div>
        </div>
      </details>

    </div>
    <div class="log-panel">
      <div class="log-label">Activity</div>
      <div id="logLines">
        <div class="log-line">Waiting for token…</div>
      </div>
    </div>
  </div>

  <audio id="agentAudio" autoplay></audio>

  <script>
    const { Room, RoomEvent, Track } = LivekitClient;
    let room = null;
    let connected = false;
    let sessionInfo = null; // { url, token, room, identity } — fetched from /token

    const dialBtn = document.getElementById('dialBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const logContainer = document.getElementById('logLines');

    let placeholderCleared = false;

    function log(msg) {
      if (!placeholderCleared) {
        logContainer.innerHTML = '';
        placeholderCleared = true;
      }
      const time = new Date().toLocaleTimeString([], { hour12: false });
      const line = document.createElement('div');
      line.className = 'log-line';
      line.innerHTML = `<span class="t">${time}</span>  ${msg}`;
      logContainer.appendChild(line);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function setStatus(text, dotClass) {
      statusText.textContent = text;
      statusDot.className = 'status-dot' + (dotClass ? ' ' + dotClass : '');
    }

    // Fetch a fresh access token from token_server.py on page load and
    // fill the (read-only) connection details panel with it — no manual
    // copy-paste needed.
    async function fetchToken() {
      try {
        const resp = await fetch('/token');
        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        sessionInfo = data;
        document.getElementById('url').value = data.url;
        document.getElementById('token').value = data.token;

        setStatus('Ready to connect', 'ready');
        dialBtn.disabled = false;
        log(`Token issued for room "${data.room}" as ${data.identity}`);
      } catch (err) {
        setStatus('Could not get a token');
        log('Token fetch failed: ' + err.message +
            ' — is token_server.py running, and is .env filled in?');
      }
    }

    async function connect() {
      if (!sessionInfo) {
        log('No token yet — retrying token fetch.');
        await fetchToken();
        if (!sessionInfo) return;
      }

      dialBtn.disabled = true;
      setStatus('Connecting…');
      log('Connecting to ' + sessionInfo.url);

      room = new Room();

      room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
        if (track.kind === Track.Kind.Audio) {
          track.attach(document.getElementById('agentAudio'));
          log('Agent audio track attached (' + participant.identity + ')');
        }
      });
      room.on(RoomEvent.ActiveSpeakersChanged, (speakers) => {
        dialBtn.classList.toggle('listening', speakers.length > 0);
      });
      room.on(RoomEvent.Disconnected, () => {
        connected = false;
        dialBtn.classList.remove('connected', 'listening');
        dialBtn.disabled = false;
        setStatus('Ready to connect', 'ready');
        log('Disconnected.');
      });

      try {
        await room.connect(sessionInfo.url, sessionInfo.token);
        log('Joined room: ' + room.name);
        await room.localParticipant.setMicrophoneEnabled(true);
        log('Microphone enabled — go ahead and ask a question.');

        connected = true;
        dialBtn.classList.add('connected', 'listening');
        dialBtn.disabled = false;
        setStatus('Connected — listening', 'live');
      } catch (err) {
        log('Connection failed: ' + err.message);
        setStatus('Connection failed');
        dialBtn.disabled = false;
      }
    }

    async function disconnect() {
      if (room) await room.disconnect();
      // Tokens are single-use in spirit here — grab a fresh one for next time.
      fetchToken();
    }

    dialBtn.addEventListener('click', () => {
      connected ? disconnect() : connect();
    });

    fetchToken();
  </script>
</body>
</html>
